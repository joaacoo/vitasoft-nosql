version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: vitasoft_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5.9.0
    container_name: vitasoft_neo4j
    ports:
      - "7474:7474" # Interfaz HTTP
      - "7687:7687" # Protocolo Bolt para Python
    environment:
      - NEO4J_AUTH=neo4j/vitasoft2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  neo4j_data:
